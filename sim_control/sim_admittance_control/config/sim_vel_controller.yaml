hardware_control_loop:
  loop_hz: 125

# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

sim_cartesian_velocity_controller:
  type: cartesian_controller/CartesianVelocityController
  publish_rate: 125
  root_name: base_link
  tip_name: ee_link
  # Cutoff of the low pass on the joint velocity, which is differentiated
  # from the measured position because the velocity Gazebo reports is not the
  # velocity of the joint - see readJointStates() in
  # kinematic_chain_controller_base.h. 0 or less turns the filter off.
  velocity_filter_cutoff: 30.0
  # Damped least squares inverse velocity kinematics. ik_sigma_min is the
  # singular value at which damping starts - see the comment on init() in
  # cartesian_velocity_controller.cpp for the measurements these come from.
  # max_joint_velocity caps the norm of the joint velocity the solver
  # returns; <=0 disables it.
  ik_sigma_min: 0.05
  ik_lambda: 0.2
  max_joint_velocity: 1.0

sim_cartesian_velocity_controller_sim:
  type: cartesian_controller/CartesianVelocityControllerSim
  publish_rate: 125
  root_name: base_link
  tip_name: ee_link
  # Cutoff of the low pass on the joint velocity, which is differentiated
  # from the measured position because the velocity Gazebo reports is not the
  # velocity of the joint - see readJointStates() in
  # kinematic_chain_controller_base.h. 0 or less turns the filter off.
  velocity_filter_cutoff: 30.0
  # Damped least squares inverse velocity kinematics. ik_sigma_min is the
  # singular value at which damping starts - see the comment on init() in
  # cartesian_velocity_controller.cpp for the measurements these come from.
  # max_joint_velocity caps the norm of the joint velocity the solver
  # returns; <=0 disables it.
  ik_sigma_min: 0.05
  ik_lambda: 0.2
  max_joint_velocity: 1.0

sim_cartesian_state_controller:
    type: cartesian_controller/CartesianStateController
    publish_rate: 125
    root_name: base_link
    tip_name: ee_link
    # Cutoff of the low pass on the joint velocity, which is differentiated
    # from the measured position because the velocity Gazebo reports is not the
    # velocity of the joint - see readJointStates() in
    # kinematic_chain_controller_base.h. 0 or less turns the filter off.
    velocity_filter_cutoff: 30.0

#Publish wrench ----------------------------------
force_torque_sensor_controller:
    type: force_torque_sensor_controller/ForceTorqueSensorController
    publish_rate: 125
