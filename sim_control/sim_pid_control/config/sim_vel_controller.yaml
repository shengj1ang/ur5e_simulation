hardware_control_loop:
  loop_hz: 125

# Settings for ros_control hardware interface
hardware_interface:
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

sim_cartesian_velocity_controller:
  type: cartesian_controller/CartesianVelocityController
  publish_rate: 125
  root_name: base_link
  tip_name: ee_link
  # Cutoff of the low pass on the joint velocity, which is differentiated
  # from the measured position because the velocity Gazebo reports is not the
  # velocity of the joint - see readJointStates() in
  # kinematic_chain_controller_base.h. 0 or less turns the filter off.
  velocity_filter_cutoff: 30.0
  # Damped least squares inverse velocity kinematics. ik_sigma_min is the
  # singular value at which damping starts - see the comment on init() in
  # cartesian_velocity_controller.cpp for the measurements these come from.
  # max_joint_velocity caps the norm of the joint velocity the solver
  # returns; <=0 disables it. This is the arm's own limit from the robot
  # description. It was 1.0, which never fired at a singularity but did
  # fire tracking a base disturbance - see cartesian_velocity_controller.cpp.
  ik_sigma_min: 0.05
  ik_lambda: 0.2
  max_joint_velocity: 3.14
  # How far the integrated position command may get ahead of the measured
  # position, in rad. This is anti-windup for the integrator in
  # writeVelocityCommands(): with gazebo_ros_control pid gains configured a
  # joint is a real servo with a torque limit and can fall behind, and
  # without this the command would keep climbing and the joint would jump
  # when it caught up. <=0 disables.
  max_command_lead: 0.1
  # Model-based position feedforward. The per-joint loop is a spring - its
  # torque is p*(q_cmd - q) with no integral term - so whatever torque a joint
  # has to hold shows up as a position error of that torque over p, and the arm
  # sits 29 mm below where it was told to be. These weights add (G + C qdot)/p
  # to the position command to cancel it: 1.0 uses the model as it is, 0
  # disables the term. See computeFeedforwardOffset() in
  # cartesian_velocity_controller.cpp.
  ff_gravity: 1.0
  ff_coriolis: 1.0
  # The p above. Left unset it is read from
  # /gazebo_ros_control/pid_gains/<joint>/p, which is the gain the plant is
  # actually using; with neither, the feedforward switches itself off, which is
  # the right answer for a kinematically positioned joint. Set it explicitly as
  # a list of six, root to tip, for anything that is not gazebo_ros_control.
  # joint_stiffness: [3120.0, 2925.0, 940.0, 70.0, 50.0, 19.0]

sim_cartesian_velocity_controller_sim:
  type: cartesian_controller/CartesianVelocityControllerSim
  # Enabled by default only for the PID simulation's world-fixed target.
  # The standalone Cartesian and admittance configurations use the plugin default (false).
  inertia_feedforward: true
  # Closed-loop calibration for single-axis base translation while holding a
  # world target. Joint vectors follow the arm chain from shoulder to wrist.
  # Gains are in base_link X/Y/Z. A zero leaves that direction to feedback and
  # the kinematic feedforward. Fade the dynamic correction outside each pose band.
  inertia_feedforward_poses: [init, 1st_reco_start]
  inertia_calibration_radius: 0.20
  inertia_calibration_fade_radius: 0.30
  inertia_feedforward_profiles:
    init:
      joints: [0.0, -1.57, 1.57, 0.0, 1.57, 1.57]
      gains: [-2.0, 2.0, 1.0]
      project_translation: [x]
    1st_reco_start:
      joints: [0.0, -1.0, 1.0, -1.57, -1.57, 0.0]
      gains: [0.0, -0.75, 0.0]
      project_translation: [y]
  publish_rate: 125
  root_name: base_link
  tip_name: ee_link
  # Cutoff of the low pass on the joint velocity, which is differentiated
  # from the measured position because the velocity Gazebo reports is not the
  # velocity of the joint - see readJointStates() in
  # kinematic_chain_controller_base.h. 0 or less turns the filter off.
  velocity_filter_cutoff: 30.0
  # Damped least squares inverse velocity kinematics. ik_sigma_min is the
  # singular value at which damping starts - see the comment on init() in
  # cartesian_velocity_controller.cpp for the measurements these come from.
  # max_joint_velocity caps the norm of the joint velocity the solver
  # returns; <=0 disables it. This is the arm's own limit from the robot
  # description. It was 1.0, which never fired at a singularity but did
  # fire tracking a base disturbance - see cartesian_velocity_controller.cpp.
  ik_sigma_min: 0.05
  ik_lambda: 0.2
  max_joint_velocity: 3.14
  # How far the integrated position command may get ahead of the measured
  # position, in rad. This is anti-windup for the integrator in
  # writeVelocityCommands(): with gazebo_ros_control pid gains configured a
  # joint is a real servo with a torque limit and can fall behind, and
  # without this the command would keep climbing and the joint would jump
  # when it caught up. <=0 disables.
  max_command_lead: 0.1
  # Model-based position feedforward. The per-joint loop is a spring - its
  # torque is p*(q_cmd - q) with no integral term - so whatever torque a joint
  # has to hold shows up as a position error of that torque over p, and the arm
  # sits 29 mm below where it was told to be. These weights add (G + C qdot)/p
  # to the position command to cancel it: 1.0 uses the model as it is, 0
  # disables the term. See computeFeedforwardOffset() in
  # cartesian_velocity_controller.cpp.
  ff_gravity: 1.0
  ff_coriolis: 1.0
  # The p above. Left unset it is read from
  # /gazebo_ros_control/pid_gains/<joint>/p, which is the gain the plant is
  # actually using; with neither, the feedforward switches itself off, which is
  # the right answer for a kinematically positioned joint. Set it explicitly as
  # a list of six, root to tip, for anything that is not gazebo_ros_control.
  # joint_stiffness: [3120.0, 2925.0, 940.0, 70.0, 50.0, 19.0]

sim_cartesian_state_controller:
    type: cartesian_controller/CartesianStateController
    publish_rate: 125
    root_name: base_link
    tip_name: ee_link
    # Cutoff of the low pass on the joint velocity, which is differentiated
    # from the measured position because the velocity Gazebo reports is not the
    # velocity of the joint - see readJointStates() in
    # kinematic_chain_controller_base.h. 0 or less turns the filter off.
    velocity_filter_cutoff: 30.0

# Publishes the operational-space dynamics (task-space inertia, centrifugal and
# Coriolis wrench, gravity wrench) on ee_dynamics, for a controller to use as a
# feedforward. It only reads the joint states, so it can run at the same time
# as whichever controller is driving the arm.
sim_cartesian_dynamics_controller:
  type: cartesian_controller/CartesianDynamicsController
  publish_rate: 125
  root_name: base_link
  tip_name: ee_link
  velocity_filter_cutoff: 30.0
  # Below this smallest singular value of the Jacobian the messages are marked
  # invalid. Same meaning as ik_sigma_min above.
  sigma_min: 0.05
  # Relative tolerance when inverting J M^-1 J^T. That matrix mixes linear and
  # angular units, so the threshold has to be relative to its largest singular
  # value rather than absolute.
  pinv_rcond: 1.0e-6
  # Fold everything rigidly attached beyond tip_name - here the coupler, the
  # gripper and the camera, 0.767 kg - into the model. Leaving it out costs
  # 29 % of the gravity torque at the working pose.
  include_tip_payload: true
  # Gravity in root_name. Valid here because every joint between world and
  # base_link has rpy 0 and the only rotation is about z.
  gravity: [0.0, 0.0, -9.81]

#Publish wrench ----------------------------------
force_torque_sensor_controller:
    type: force_torque_sensor_controller/ForceTorqueSensorController
    publish_rate: 125
